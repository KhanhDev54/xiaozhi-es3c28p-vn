name: Build ES3C28P 2.8" (VN + Navigation)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build xiaozhi-ai-iot-vietnam-es3n28p-lcd-2.8-nav
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: espressif/idf:release-v5.5
    env:
      BOARD: xiaozhi-ai-iot-vietnam-es3n28p-lcd-2.8
      VARIANT: xiaozhi-ai-iot-vietnam-es3n28p-lcd-2.8-nav
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          source $IDF_PATH/export.sh
          python scripts/release.py "$BOARD" --name "$VARIANT"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.VARIANT }}_${{ github.sha }}
          path: |
            build/merged-binary.bin
            releases/*.zip
          if-no-files-found: error
          retention-days: 30
