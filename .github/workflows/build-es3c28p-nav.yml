name: Build ES3C28P 2.8" (VN + Navigation)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build xiaozhi-ai-iot-vietnam-es3n28p-lcd-2.8-nav
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: espressif/idf:release-v5.5
    env:
      BOARD: xiaozhi-ai-iot-vietnam-es3n28p-lcd-2.8
      VARIANT: xiaozhi-ai-iot-vietnam-es3n28p-lcd-2.8-nav
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          source $IDF_PATH/export.sh
          python scripts/release.py "$BOARD" --name "$VARIANT"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.VARIANT }}_${{ github.sha }}
          path: |
            build/merged-binary.bin
            releases/*.zip
          if-no-files-found: error
          retention-days: 30

  pages:
    name: Publish web flasher (GitHub Pages)
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      VARIANT: xiaozhi-ai-iot-vietnam-es3n28p-lcd-2.8-nav
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.VARIANT }}_${{ github.sha }}
          path: dl

      - name: Assemble site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/firmware
          cp web/* site/
          cp dl/build/merged-binary.bin site/firmware/xiaozhi-es3c28p-vn-nav.bin
          VERSION=$(sed -n 's/^set(PROJECT_VER "\(.*\)")/\1/p' CMakeLists.txt)
          SIZE=$(stat -c %s site/firmware/xiaozhi-es3c28p-vn-nav.bin)
          DATE=$(date -u +%Y-%m-%d)
          cat > site/firmware.json <<JSON
          {
            "firmwares": [
              {
                "name": "Xiaozhi VN 2.8\" + Dẫn đường",
                "file": "firmware/xiaozhi-es3c28p-vn-nav.bin",
                "address": 0,
                "chip": "ESP32-S3",
                "version": "${VERSION}",
                "commit": "${GITHUB_SHA}",
                "date": "${DATE}",
                "size": ${SIZE},
                "notes": "ES3C28P/ES3N28P 16MB · tiếng Việt · nhạc · thời tiết · dẫn đường (Chronos)"
              }
            ]
          }
          JSON
          python3 -m json.tool site/firmware.json > /dev/null
          ls -la site site/firmware

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
